name: proyectos-i-ii-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proyecto-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests and coverage gate (>= 60%)
        run: |
          uv run pytest -q \
            --cov=proyecto_1.cli \
            --cov=proyecto_1.contracts \
            --cov=proyecto_1.loader \
            --cov=proyecto_1.metrics \
            --cov=proyecto_1.validator \
            --cov-report=term-missing \
            --cov-fail-under=60

